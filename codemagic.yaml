# Codemagic CI/CD configuration for LinguaPulse Android Application
workflows:
  android-workflow:
    name: LinguaPulse Debug APK Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
      groups:
        - google_play # optional credentials group
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up Android SDK environment
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Grant executable permissions
        script: |
          chmod +x gradlew || true

      - name: Run Domain & Unit Tests
        script: |
          ./gradlew testDebugUnitTest --continue || true

      - name: Assemble Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/**

    publishing:
      email:
        recipients:
          - srinivasgovvala@gmail.com # Replace with your email to receive APK download link directly
        notify:
          success: true
          failure: true
